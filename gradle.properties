# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric toolchain (Minecraft 1.21.1 lane — see README "Version lanes")
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
# >= 0.17.0 required: Controlify 2.5.0 depends on Fabric Loader >= 0.17.0.
loader_version=0.17.3
# Loom >= 1.14.4 required: Controlify 2.5.0 embeds Loom-1.14.4 build metadata.
loom_version=1.16.3

# Fabric API
fabric_version=0.116.12+1.21.1

# Mod metadata
mod_version=0.1.0
maven_group=io.ascent.nsplit
archives_base_name=native-split-screen

# Controlify — controller layer (Phase 1). 2.5.0 is the latest for the 1.21.1 lane;
# the 3.0.0+lts line does not publish a 1.21.1 build.
controlify_version=2.5.0+1.21.1-fabric
# YACL must match what Controlify 2.5.0 depends on (exact). Needed on the remap classpath
# so Controlify's YACL-widget MC calls remap correctly (see build.gradle).
yacl_version=3.8.0+1.21.1-fabric
