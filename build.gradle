plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Controlify + libsdl4j + YACL live here.
	maven {
		name = 'Xander'
		url = 'https://maven.isxander.dev/releases'
	}
	// YACL pulls org.quiltmc.parsers (json/gson) from here.
	maven {
		name = 'QuiltMC'
		url = 'https://maven.quiltmc.org/repository/release/'
	}
	// Sodium (for the Controlify remap classpath only — see build deps).
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// --- Phase 1: Controlify (controller enumeration / assignment) ---------------
	// Optional dependency: compile against the API only (transitive = false avoids
	// Controlify's heavy optional graph — sodium/iris/modmenu/voicechat). All usage is
	// guarded behind FabricLoader.isModLoaded("controlify") and isolated in the
	// io.ascent.nsplit.controller.compat package, so the mod runs fine without it.
	// To exercise it in dev (spike S1), install Controlify + its deps in the run mods.
	modCompileOnly("dev.isxander:controlify:${project.controlify_version}") {
		transitive = false
	}
	// YACL MUST be on Controlify's remap classpath. Controlify's controller-settings screen
	// calls MC methods inherited by YACL widgets (e.g. OptionListWidget.setScrollAmount). With
	// transitive=false above, Loom couldn't see YACL's class hierarchy and left those calls as
	// intermediary names (method_25307...), which crash at runtime (NoSuchMethodError) the
	// moment a controller navigates the settings tabs. Adding YACL here lets the remap resolve
	// them. Compile-only; the runtime copy comes transitively via modLocalRuntime below.
	modCompileOnly("dev.isxander:yet-another-config-lib:${project.yacl_version}") {
		transitive = false
	}
	// Same reasoning for Sodium: Controlify's Sodium-settings integration calls MC methods
	// inherited by Sodium GUI classes; without Sodium on the remap classpath those stay
	// intermediary and crash when the video-settings screen is navigated with a controller.
	// The dev run mods include Sodium, so this path is live. Compile-only (remap classpath).
	modCompileOnly("maven.modrinth:sodium:mc1.21.1-0.6.13-fabric") {
		transitive = false
	}

	// Dev-only: makes `runClient` actually load Controlify so spike S1 can be exercised
	// in-IDE. Optional integration mods (sodium/iris/reese/immediatelyfast/voicechat via
	// maven.modrinth, modmenu via terraformersmc) are excluded to keep the dev runtime lean;
	// YACL (required) + quilt parsers resolve from the Xander/Quilt repos. NOT in the
	// published jar — modLocalRuntime is dev-classpath only.
	modLocalRuntime("dev.isxander:controlify:${project.controlify_version}") {
		exclude group: "maven.modrinth"
		exclude group: "com.terraformersmc"
	}
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	// Bytecode targets Java 21 (Minecraft 1.21.x baseline). The Gradle daemon must run on
	// a JDK >= 21 (this repo's CI/dev uses JDK 24; see README "Build"). We deliberately do
	// NOT configure a Java toolchain: toolchain auto-provisioning via the foojay resolver is
	// broken on Gradle 9 (references the removed JvmVendorSpec.IBM_SEMERU), and the daemon
	// JVM already satisfies Loom's >= 21 requirement.
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// macOS doubles controller input: recent macOS enumerates one Xbox/Switch pad twice — once via
// the GameController framework (MFI) and once via SDL's HIDAPI driver — so a single D-pad press
// or stick move registers ~twice (recipe-book skipping, jumpy virtual mouse, phantom joins).
// Disable HIDAPI for those pad types so only the GameController path is used (it also provides
// the background/unfocused input couch co-op relies on). Controlify forces HIDAPI on generally
// but does not set these per-type hints, so the env vars hold. Applied to the dev host here and
// to spawned children in InstanceLauncher.
tasks.named('runClient') {
	environment 'SDL_JOYSTICK_HIDAPI_XBOX', '0'
	environment 'SDL_JOYSTICK_HIDAPI_SWITCH', '0'
}
